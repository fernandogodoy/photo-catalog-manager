<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova Venda - Photo Catalog Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="/">
                <i class="fas fa-camera"></i>
                Photo Catalog Manager
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/"><i class="fas fa-home"></i> Home</a>
                    </li>
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown">
                            <i class="fas fa-archive"></i> Arquivos
                        </a>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item" href="/directories/new"><i class="fas fa-folder-plus"></i> Criar Pasta</a></li>
                            <li><a class="dropdown-item" href="/products/import"><i class="fas fa-upload"></i> Importar Produto</a></li>
                            <li><a class="dropdown-item" href="/directories/import"><i class="fas fa-folder-open"></i> Importar Diretório</a></li>
                        </ul>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="/sales/new"><i class="fas fa-shopping-cart"></i> Lançar Venda</a>
                    </li>
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown">
                            <i class="fas fa-chart-bar"></i> Relatórios
                        </a>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item" href="/sales/history"><i class="fas fa-history"></i> Histórico Venda</a></li>
                            <li><a class="dropdown-item" href="/products"><i class="fas fa-boxes"></i> Estoque</a></li>
                        </ul>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/config"><i class="fas fa-cog"></i> Configurações</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card">
                    <div class="card-header">
                        <h4><i class="fas fa-plus"></i> Nova Venda</h4>
                    </div>
                    <div class="card-body">
                        <div th:if="${error}" class="alert alert-danger" role="alert">
                            <i class="fas fa-exclamation-triangle"></i>
                            <span th:text="${error}">Erro</span>
                        </div>

                        <form action="/sales" method="post">
                            <div class="row">
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label for="client" class="form-label">Cliente *</label>
                                        <input type="text" class="form-control" id="client" name="client" required>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label for="address" class="form-label">Endereço</label>
                                        <input type="text" class="form-control" id="address" name="address">
                                    </div>
                                </div>
                            </div>

                            <div class="row">
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label for="amount" class="form-label">Valor Total *</label>
                                        <input type="text" class="form-control" id="amount" name="amount" placeholder="0.00" required>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label for="quantity" class="form-label">Quantidade *</label>
                                        <input type="number" class="form-control" id="quantity" name="quantity" min="1" required>
                                    </div>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Produtos Disponíveis</label>
                                <div th:if="${#lists.isEmpty(availableProducts)}" class="alert alert-warning">
                                    <i class="fas fa-exclamation-triangle"></i>
                                    Não há produtos disponíveis no momento.
                                    <a href="/products/import" class="alert-link">Importe produtos</a> primeiro.
                                </div>
                                
                                <div th:if="${!#lists.isEmpty(availableProducts)}" class="border rounded p-3" style="max-height: 300px; overflow-y: auto;">
                                    <div th:each="product : ${availableProducts}" class="form-check">
                                        <input class="form-check-input" type="checkbox" name="productIds" th:value="${product.id}" th:id="${'product' + product.id}">
                                        <label class="form-check-label" th:for="${'product' + product.id}">
                                            <strong th:text="${#strings.abbreviate(product.uuid, 25)}">UUID</strong> - 
                                            <span th:text="${product.directoryDescrition}">Diretório</span> - 
                                            <span th:text="${product.formatedValue}" class="text-success">Valor</span>
                                        </label>
                                    </div>
                                </div>
                            </div>

                            <div class="d-flex justify-content-between">
                                <a href="/sales" class="btn btn-secondary">
                                    <i class="fas fa-arrow-left"></i> Voltar
                                </a>
                                <button type="submit" class="btn btn-success" th:disabled="${#lists.isEmpty(availableProducts)}">
                                    <i class="fas fa-save"></i> Criar Venda
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Auto-calculate quantity based on selected products
        document.addEventListener('DOMContentLoaded', function() {
            const checkboxes = document.querySelectorAll('input[name="productIds"]');
            const quantityInput = document.getElementById('quantity');
            
            checkboxes.forEach(checkbox => {
                checkbox.addEventListener('change', function() {
                    const checkedCount = document.querySelectorAll('input[name="productIds"]:checked').length;
                    quantityInput.value = checkedCount;
                });
            });
        });
    </script>
</body>
</html>
