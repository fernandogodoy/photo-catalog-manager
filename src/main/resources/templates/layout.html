<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Catalog Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">

                <i class="fas fa-camera"></i>
                Photo Catalog Manager
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/"><i class="fas fa-home"></i> Home</a>
                    </li>
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown">
                            <i class="fas fa-archive"></i> Arquivos
                        </a>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item" href="/directories/new"><i class="fas fa-folder-plus"></i> Criar Pasta</a></li>
                            <li><a class="dropdown-item" href="/products/import"><i class="fas fa-upload"></i> Importar Produto</a></li>

                        </a>

                            <li><a class="dropdown-item" href="/sales/history"><i class="fas fa-history"></i> Histórico Venda</a></li>
                            <li><a class="dropdown-item" href="/products"><i class="fas fa-boxes"></i> Estoque</a></li>
                        </ul>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/config"><i class="fas fa-cog"></i> Configurações</a>
                    </li>
                </ul>
            </div>
        </div>

    <div class="container mt-4" th:fragment="content">
        <!-- Content will be replaced by individual pages -->
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
